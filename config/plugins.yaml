# AgentBox 插件配置文件
# 定义需要启用的插件列表
# 详细配置请参考 plugins/*/plugin.yaml

plugins:
  # Claude Code CLI - Anthropic 官方 AI 编程助手
  - name: claude-code
    enabled: true

  # Qwen Code CLI - 阿里云通义千问 AI 编程助手
  - name: qwen-code
    enabled: true

  # OpenCode AI - 开源 AI 编程助手
  - name: opencode
    enabled: true

  # OpenClaw - 个人 AI 助手，支持多渠道消息平台
  - name: openclaw
    enabled: true

  # VS Code Server - 浏览器中的 VS Code IDE
  - name: vscode-server
    enabled: true

  # Web Terminal - 浏览器终端服务
  - name: web-terminal
    enabled: true

  # Kilocode CLI - AI 编程助手命令行工具
  - name: kilocode
    enabled: true

  # CoPaw - AgentScope AI 编程助手
  - name: copaw
    enabled: true

  # OpenAI Codex CLI - OpenAI 官方 AI 编程助手
  - name: codex
    enabled: true

  # ClawPanel - OpenClaw AI Agent 可视化管理面板（纯 Web 服务）
  - name: clawpanel
    enabled: true

  # OpenClaw Dashboard - OpenClaw AI Agent 官方可视化管理面板（纯 Web 服务）
  - name: openclaw-dashboard
    enabled: true

  # ClawPort UI - OpenClaw AI Agent 可视化管理中心（Org Map、Chat、Kanban 等）
  - name: clawport-ui
    enabled: true

  # Skills Manager - AI 编程助手技能管理工具（浏览器访问）
  - name: skills-manager
    enabled: true

  # OpenClaw Manager - OpenClaw AI Agent 桌面管理工具（通过浏览器访问）
  - name: openclaw-manager
    enabled: true

  # AgentBox Dashboard - 统一服务入口面板
  - name: board
    enabled: true

  # Cursor CLI - AI 编程助手命令行工具
  - name: cursor-cli
    enabled: true

  # Docker CLI - 容器管理工具
  - name: docker
    enabled: true

  # HiClaw - AI Agent 平台，集成 Higress 网关和 Matrix 消息平台
  - name: hiclaw
    enabled: true

  # xvfb - 已禁用，各应用使用独立 Xvfb 实例
  # - name: xvfb
  #   enabled: false

  # DeerFlow - Super Agent Harness (sub-agents, memory, sandbox, skills)
  - name: deer-flow
    enabled: true
