# CoPaw 插件定义
name: copaw
version: "1.0.0"
description: CoPaw - AgentScope AI 编程助手

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/copaw/scripts/install.sh

# 环境变量配置
env:
  COPAW_PORT: export COPAW_PORT=${COPAW_PORT:-8088}
  PATH_APPEND: ~/.copaw/bin

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/copaw/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.copaw

# 服务配置（Web 应用服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 3
  command: bash ~/plugins-config/copaw/scripts/start.sh

# 健康检查
healthcheck:
  command: copaw -h

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/copaw/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/copaw/scripts/update.sh

# 标签
tags:
  - ai
  - coding