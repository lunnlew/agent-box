# Superset 插件定义
name: superset
version: "1.1.7"
description: Superset - 强大的桌面集成开发环境（通过浏览器访问）

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/superset/scripts/install.sh

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/superset/scripts/post_install.sh

# 环境变量
env:
  SUPERSET_NOVNC_PORT: export SUPERSET_NOVNC_PORT=${SUPERSET_NOVNC_PORT:-6081}
  SUPERSET_VNC_PORT: export SUPERSET_VNC_PORT=${SUPERSET_VNC_PORT:-5901}

# 需要持久化的目录
volumes:
  - ~/.superset
  - ~/tools/appimages/Superset

# 服务配置（GUI 应用服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 5
  command: bash ~/plugins-config/superset/scripts/start.sh

# 健康检查
healthcheck:
  command: test -f ~/tools/appimages/Superset/squashfs-root/AppRun

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/superset/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/superset/scripts/update.sh

# 标签
tags:
  - gui
  - ide