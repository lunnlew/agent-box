# Skills Manager 插件定义
# 使用独立的 Xvfb 显示环境，不依赖 xvfb 插件
name: skills-manager
version: "1.1.5"
description: Skills Manager - AI 编程助手技能管理工具（通过浏览器访问）

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/skills-manager/scripts/install.sh

# 环境变量配置
env:
  SKILLS_MANAGER_NOVNC_PORT: export SKILLS_MANAGER_NOVNC_PORT=${SKILLS_MANAGER_NOVNC_PORT:-6080}
  SKILLS_MANAGER_VNC_PORT: export SKILLS_MANAGER_VNC_PORT=${SKILLS_MANAGER_VNC_PORT:-5900}
  SKILLS_MANAGER_VERSION: export SKILLS_MANAGER_VERSION=${SKILLS_MANAGER_VERSION:-1.1.5}

# 需要持久化的目录
volumes:
  - ~/.skills-manager
  - ~/tools/appimages/Skills-Manager

# 健康检查
healthcheck:
  command: test -f ~/tools/appimages/Skills-Manager/squashfs-root/AppRun

# 服务配置（GUI 应用服务）
service:
  # 常驻服务，使用 Supervisor 管理
  daemon: true
  # 服务启动后自动启动
  auto_start: true
  # 服务崩溃后自动重启
  restart: true
  # 最大重启次数
  max_restarts: 5
  # 启动命令
  command: bash ~/plugins-config/skills-manager/scripts/start.sh
  # 停止命令
  stop_command: bash ~/plugins-config/skills-manager/scripts/stop.sh
  # 重启命令
  restart_command: bash ~/plugins-config/skills-manager/scripts/restart.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/skills-manager/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/skills-manager/scripts/update.sh

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/skills-manager/scripts/post_install.sh

# 服务端口信息
ports:
  - 6080: Skills Manager noVNC (独立实例)
  - 5900: Skills Manager VNC (独立实例)

# 标签
tags:
  - gui
  - novnc
  - skills
  - appimage