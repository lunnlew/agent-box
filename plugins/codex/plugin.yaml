# OpenAI Codex 插件定义
name: codex
version: "0.80.0"
description: OpenAI Codex CLI - OpenAI官方AI编程助手

# 依赖要求
requires:
  - nodejs
  - npm

# 安装命令
install:
  - |
    # 先尝试正常卸载
    npm uninstall -g @openai/codex 2>/dev/null || true
    # 清理可能残留的目录（处理 ENOTEMPTY 错误）
    CODEX_PATH=$(npm root -g 2>/dev/null)/@openai/codex
    if [ -d "$CODEX_PATH" ]; then
      rm -rf "$CODEX_PATH" 2>/dev/null || true
    fi
    # 全局安装
    npm install -g @openai/codex@0.80.0

# 环境变量配置
env:
  OPENAI_API_KEY: optional

# 需要持久化的目录
volumes:
  - ~/.codex: Codex配置和缓存

# 健康检查
healthcheck:
  command: codex --version

# 卸载命令
uninstall:
  - npm uninstall -g @openai/codex

# 更新命令
update:
  - npm update -g @openai/codex