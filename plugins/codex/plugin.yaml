# OpenAI Codex 插件定义
name: codex
version: "0.80.0"
description: OpenAI Codex CLI - OpenAI 官方 AI 编程助手

# 依赖要求
requires:
  - nodejs
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/codex/scripts/install.sh

# 环境变量配置
env:
  OPENAI_API_KEY: optional
  CODEX_VERSION: export CODEX_VERSION=${CODEX_VERSION:-0.80.0}

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/codex/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.codex

# 健康检查
healthcheck:
  command: codex --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/codex/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/codex/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant