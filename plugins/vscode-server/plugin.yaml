# VS Code Server 插件定义
name: vscode-server
version: "1.0.0"
description: VS Code Server - 通过浏览器访问完整的 VS Code IDE

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/vscode-server/scripts/install.sh

# 环境变量配置
env:
  VSCODE_PORT: export VSCODE_PORT=${VSCODE_PORT:-8080}
  VSCODE_PASSWORD: optional
  STANDALONE_INSTALL_PREFIX: export STANDALONE_INSTALL_PREFIX="$HOME/.code-server"
  PATH_APPEND: ~/.code-server/bin

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/vscode-server/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.code-server
  - ~/.config/code-server

# 服务配置（Web 应用服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 3
  command: bash ~/plugins-config/vscode-server/scripts/start.sh

# 健康检查
healthcheck:
  command: code-server --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/vscode-server/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/vscode-server/scripts/update.sh

# 标签
tags:
  - web
  - ide
  - vscode