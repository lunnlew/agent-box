# ClawPanel 插件定义
# OpenClaw 可视化管理面板 - 纯 Web 服务，无需 GUI/ noVNC
name: clawpanel
version: "0.9.1"
description: ClawPanel - OpenClaw AI Agent 可视化管理面板（纯 Web 服务）

# 依赖要求
requires:
  - nodejs >= 18
  - npm
  - git

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/clawpanel/scripts/install.sh

# 环境变量配置
env:
  CLAWPANEL_PORT: export CLAWPANEL_PORT=${CLAWPANEL_PORT:-1420}

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/clawpanel/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.openclaw
  - ~/tools/clawpanel
  - ~/logs/clawpanel.log

# 服务配置（Web 服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 5
  command: bash ~/plugins-config/clawpanel/scripts/start.sh

# 健康检查
healthcheck:
  command: curl -fsS http://localhost:${CLAWPANEL_PORT:-1420} > /dev/null 2>&1

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/clawpanel/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/clawpanel/scripts/update.sh

# 标签
tags:
  - web
  - openclaw