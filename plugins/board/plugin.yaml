# AgentBox Dashboard 插件定义
name: board
version: "1.0.0"
description: AgentBox Dashboard - 统一服务入口面板，显示所有可浏览器访问的服务

# 依赖要求
requires:
  - python3

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/board/scripts/install.sh

# 环境变量
env:
  BOARD_PORT: export BOARD_PORT=${BOARD_PORT:-8888}

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/board/scripts/post_install.sh

# 需要持久化的目录
volumes: []

# 服务配置（Web 面板服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 3
  command: bash ~/plugins-config/board/scripts/start.sh

# 健康检查
healthcheck:
  command: test -f ~/plugins-config/board/scripts/start.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/board/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/board/scripts/update.sh

# 标签
tags:
  - web
  - dashboard