# Claude Code 插件定义
name: claude-code
version: "1.0.0"
description: Claude Code CLI - Anthropic 官方 AI 编程助手

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/claude-code/scripts/install.sh

# 环境变量配置
env:
  ANTHROPIC_API_KEY: optional
  PATH_APPEND: ~/.local/bin

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/claude-code/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.claude
  - ~/.claude.json
  - ~/.local

# 健康检查
healthcheck:
  command: claude --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/claude-code/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/claude-code/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant