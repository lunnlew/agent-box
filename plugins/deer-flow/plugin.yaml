# DeerFlow 插件定义
name: deer-flow
version: "2.0.0"
description: DeerFlow - Super Agent Harness (sub-agents, memory, sandbox, skills)

# 依赖要求
requires:
  - docker
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/deer-flow/scripts/install.sh

# 环境变量配置
env:
  DEERFLOW_PORT: export DEERFLOW_PORT=${DEERFLOW_PORT:-2026}
  DASHSCOPE_API_KEY: export DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}

# 需要持久化的目录
volumes:
  - ~/deer-flow
  - ~/deer-flow/.env
  - ~/deer-flow/config.yaml

# 健康检查
healthcheck:
  command: curl -sf http://localhost:${DEERFLOW_PORT:-2026} >/dev/null 2>&1 || docker ps --filter name=deer-flow --filter status=running -q | grep -q .

# 服务配置 - 使用 Docker 容器运行
service:
  daemon: false
  auto_start: true
  command: bash ~/plugins-config/deer-flow/scripts/start.sh
  stop_command: bash ~/plugins-config/deer-flow/scripts/stop.sh
  restart_command: bash ~/plugins-config/deer-flow/scripts/restart.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/deer-flow/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/deer-flow/scripts/update.sh

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/deer-flow/scripts/post_install.sh

# 服务端口信息
ports:
  - 2026: DeerFlow Gateway (映射到 ${DEERFLOW_PORT:-2026})

# 标签
tags:
  - ai-agent
  - super-agent-harness
  - langgraph
  - docker