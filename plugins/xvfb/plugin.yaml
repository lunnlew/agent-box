# Xvfb 基础服务插件
# 仅提供虚拟显示环境，不包含 x11vnc 和 noVNC
name: xvfb
version: "1.0.0"
description: Xvfb 虚拟显示基础服务 - 仅提供虚拟 X 显示环境

# 依赖要求
requires:
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/xvfb/scripts/install.sh

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/xvfb/scripts/post_install.sh

# 环境变量
env:
  DISPLAY: export DISPLAY=:99
  GDK_BACKEND: export GDK_BACKEND=x11
  NO_AT_BRIDGE: export NO_AT_BRIDGE=1

# 持久化目录（脚本存放在 tools 目录）
volumes:
  - ~/tools/xvfb-scripts

# 服务配置（基础显示服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 3
  command: bash ~/plugins-config/xvfb/scripts/start.sh

# 健康检查
healthcheck:
  command: pgrep -f 'Xvfb :99'

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/xvfb/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/xvfb/scripts/update.sh

# 标签
tags:
  - system
  - display