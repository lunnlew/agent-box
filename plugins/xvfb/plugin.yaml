# Xvfb 基础服务插件
# 仅提供虚拟显示环境，不包含 x11vnc 和 noVNC
name: xvfb
version: "1.0.0"
description: Xvfb 虚拟显示基础服务 - 仅提供虚拟 X 显示环境

# 依赖要求
requires:
  - bash

# 安装命令
install:
  - |
    set +e

    log_info "Installing Xvfb..."
    rm -rf  ~/tools/xvfb-scripts/* 2>/dev/null || true

    # 复制启动脚本到可写目录
    if [ -f /home/agent/plugins-config/xvfb/start-xvfb.sh ]; then
      mkdir -p ~/tools/xvfb-scripts
      cp /home/agent/plugins-config/xvfb/start-xvfb.sh ~/tools/xvfb-scripts/
      chmod +x ~/tools/xvfb-scripts/start-xvfb.sh
    fi

    log_success "Xvfb installed successfully"

# 安装后配置
post_install:
  - |
    echo ""
    echo "============================================"
    echo "  Xvfb 安装完成!"
    echo "============================================"
    echo ""
    echo "显示环境：DISPLAY=:99"
    echo "脚本目录：~/plugins-config/xvfb"
    echo ""
    echo "注意：此插件仅提供虚拟显示环境"
    echo "各 GUI 应用需自行启动 x11vnc + noVNC 实例"
    echo "============================================"
    echo ""

# 环境变量
env:
  DISPLAY: export DISPLAY=:99
  GDK_BACKEND: export GDK_BACKEND=x11
  NO_AT_BRIDGE: export NO_AT_BRIDGE=1

# 需要持久化的目录
volumes:
  - ~/plugins-data/xvfb: Xvfb 脚本目录

# 服务配置（基础显示服务）
service:
  # 常驻服务，使用 Supervisor 管理
  daemon: true
  # 服务启动后自动启动
  auto_start: true
  # 服务崩溃后自动重启
  restart: true
  # 最大重启次数
  max_restarts: 3
  # 启动命令
  command: /home/agent/tools/xvfb-scripts/start-xvfb.sh

# 健康检查
healthcheck:
  command: "pgrep -f 'Xvfb :99'"

# 卸载命令
uninstall:
  - |
    set +e

    log_info "Uninstalling Xvfb..."

    # 停止服务
    pkill -f "Xvfb.*:99" 2>/dev/null || true

    # 清理临时文件
    rm -rf /tmp/.X11-unix/X99 2>/dev/null || true

    rm -rf ~/supervisor/xvfb.conf 2>/dev/null || true
    rm -rf ~/supervisor/xvfb.sh 2>/dev/null || true

    log_success "Xvfb uninstalled"

# 更新命令
update:
  - |
    set +e

    log_info "Updating Xvfb..."

    # 重新复制启动脚本
    if [ -f /home/agent/plugins-config/xvfb/start-xvfb.sh ]; then
      cp /home/agent/plugins-config/xvfb/start-xvfb.sh ~/tools/xvfb-scripts/
      chmod +x ~/tools/xvfb-scripts/start-xvfb.sh
    fi

    log_success "Xvfb updated successfully"
