# OpenClaw Manager 插件定义
# OpenClaw Manager Desktop GUI 应用（通过浏览器访问）
name: openclaw-manager
version: "0.0.7"
description: OpenClaw Manager - OpenClaw AI Agent 可视化管理工具（通过浏览器访问）

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/openclaw-manager/scripts/install.sh

# 环境变量配置
env:
  OPENCLAW_MANAGER_NOVNC_PORT: export OPENCLAW_MANAGER_NOVNC_PORT=${OPENCLAW_MANAGER_NOVNC_PORT:-6081}
  OPENCLAW_MANAGER_VNC_PORT: export OPENCLAW_MANAGER_VNC_PORT=${OPENCLAW_MANAGER_VNC_PORT:-5901}
  OPENCLAW_MANAGER_VERSION: export OPENCLAW_MANAGER_VERSION=${OPENCLAW_MANAGER_VERSION:-0.0.7}

# 需要持久化的目录
volumes:
  - ~/.openclaw
  - ~/.openclaw-manager
  - ~/tools/appimages/OpenClaw-Manager

# 健康检查
healthcheck:
  command: test -f ~/tools/appimages/OpenClaw-Manager/squashfs-root/AppRun

# 服务配置（GUI 应用服务）
service:
  # 常驻服务，使用 Supervisor 管理
  daemon: true
  # 服务启动后自动启动
  auto_start: true
  # 服务崩溃后自动重启
  restart: true
  # 最大重启次数
  max_restarts: 5
  # 启动命令
  command: bash ~/plugins-config/openclaw-manager/scripts/start.sh
  # 停止命令
  stop_command: bash ~/plugins-config/openclaw-manager/scripts/stop.sh
  # 重启命令
  restart_command: bash ~/plugins-config/openclaw-manager/scripts/restart.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/openclaw-manager/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/openclaw-manager/scripts/update.sh

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/openclaw-manager/scripts/post_install.sh

# 服务端口信息
ports:
  - 6081: OpenClaw Manager noVNC (独立实例)
  - 5901: OpenClaw Manager VNC (独立实例)

# 标签
tags:
  - gui
  - novnc
  - openclaw
  - appimage