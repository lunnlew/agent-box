# Qwen Code 插件定义
name: qwen-code
version: "1.0.0"
description: Qwen Code CLI - 阿里云通义千问AI编程助手

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令
install:
  - |
    # 先尝试正常卸载
    npm uninstall -g @qwen-code/qwen-code 2>/dev/null || true
    # 清理可能残留的目录（处理 ENOTEMPTY 错误）
    QWEN_CODE_PATH=$(npm root -g 2>/dev/null)/@qwen-code/qwen-code
    if [ -d "$QWEN_CODE_PATH" ]; then
      rm -rf "$QWEN_CODE_PATH" 2>/dev/null || true
    fi
    # 全局安装
    npm install -g @qwen-code/qwen-code

# 环境变量配置
env:
  DASHSCOPE_API_KEY: required

# 需要持久化的目录
volumes:
  - ~/.qwen-code: Qwen Code配置和缓存

# 健康检查
healthcheck:
  command: qwen --version

# 卸载命令
uninstall:
  - npm uninstall -g @qwen-code/qwen-code

# 更新命令
update:
  - npm update -g @qwen-code/qwen-code