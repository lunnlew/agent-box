# Qwen Code CLI 插件定义
name: qwen-code
version: "1.0.0"
description: Qwen Code CLI - 阿里云通义千问 AI 编程助手

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/qwen-code/scripts/install.sh

# 环境变量配置
env:
  DASHSCOPE_API_KEY: optional

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/qwen-code/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.qwen-code

# 健康检查
healthcheck:
  command: qwen --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/qwen-code/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/qwen-code/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant