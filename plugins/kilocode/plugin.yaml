# Kilocode CLI 插件定义
name: kilocode
version: "1.0.0"
description: Kilocode CLI - AI 编程助手命令行工具

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令
install:
  - |
    set +e

    PKG_NAME="@kilocode/cli"
    NPM_ROOT=$(npm root -g 2>/dev/null)
    PKG_PATH="$NPM_ROOT/@kilocode/cli"
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    PKG_BIN="$NPM_PREFIX/bin/kilocode"

    log_info "NPM root: $NPM_ROOT"
    log_info "NPM prefix: $NPM_PREFIX"
    log_info "Installing Kilocode CLI..."

    # 清理旧版本
    log_info "Cleaning up existing installation..."
    npm uninstall -g "$PKG_NAME" 2>/dev/null || true
    [ -d "$PKG_PATH" ] && rm -rf "$PKG_PATH" 2>/dev/null || true
    [ -L "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true
    [ -f "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true

    # 清理临时目录
    for tmp_dir in "$NPM_ROOT"/.kilocode-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    # 安装
    log_info "Installing package..."
    if ! npm install -g "$PKG_NAME"; then
      log_warning "First attempt failed, retrying..."
      sleep 2
      npm install -g "$PKG_NAME"
    fi

    # 验证安装
    log_info "Verifying installation..."
    if [ ! -f "$PKG_PATH/package.json" ]; then
      log_error "Installation incomplete: package.json missing"
      exit 1
    fi

    # 检查二进制文件或符号链接是否存在
    if [ ! -L "$PKG_BIN" ] && [ ! -f "$PKG_BIN" ]; then
      log_error "Installation incomplete: binary not found at $PKG_BIN"
      # 尝试备用路径
      if [ -L "$HOME/tools/bin/kilocode" ] || [ -f "$HOME/tools/bin/kilocode" ]; then
        log_info "Binary found at $HOME/tools/bin/kilocode, creating symlink..."
        mkdir -p "$(dirname "$PKG_BIN")"
        ln -sf "$HOME/tools/bin/kilocode" "$PKG_BIN" 2>/dev/null || true
      else
        log_error "Binary also not found at $HOME/tools/bin/kilocode"
        log_info "Available binaries in $HOME/tools/bin:"
        ls -la "$HOME/tools/bin/" 2>/dev/null | grep -i kilocode || echo "(none)"
        exit 1
      fi
    fi

    # 最终清理
    for tmp_dir in "$NPM_ROOT"/.kilocode-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    kilocode --version
    log_success "Kilocode CLI installed successfully"

# 环境变量配置
env:
  KILOCODE_API_KEY: optional

# 需要持久化的目录
volumes:
  - ~/.config/kilo

# 健康检查
healthcheck:
  command: kilocode --version

# 卸载命令
uninstall:
  - |
    set +e

    PKG_NAME="@kilocode/cli"
    PKG_PATH="$(npm root -g 2>/dev/null)/@kilocode/cli"
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    PKG_BIN="$NPM_PREFIX/bin/kilocode"

    log_info "Uninstalling Kilocode CLI..."

    # npm 卸载
    npm uninstall -g "$PKG_NAME" 2>/dev/null || true

    # 清理残留目录
    [ -d "$PKG_PATH" ] && rm -rf "$PKG_PATH" 2>/dev/null || true
    [ -L "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true
    [ -f "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true

    # 清理临时目录
    for tmp_dir in "$(npm root -g 2>/dev/null)"/.kilocode-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    # 可选：保留用户配置
    # rm -rf ~/.config/kilo 2>/dev/null || true

    log_success "Kilocode CLI uninstalled"

# 更新命令
update:
  - |
    set +e

    PKG_NAME="@kilocode/cli"
    PKG_PATH="$(npm root -g 2>/dev/null)/@kilocode/cli"

    log_info "Updating Kilocode CLI..."

    # 备份用户配置
    if [ -d ~/.config/kilo ]; then
      cp -r ~/.config/kilo ~/.config/kilo.bak.$(date +%Y%m%d%H%M%S) 2>/dev/null || true
    fi

    # 更新
    npm update -g "$PKG_NAME" || {
      log_warning "Update failed, reinstalling..."
      npm install -g "$PKG_NAME"@latest
    }

    # 验证
    if [ ! -f "$PKG_PATH/package.json" ]; then
      log_error "Update verification failed"
      # 恢复备份
      if [ -d ~/.config/kilo.bak.* ]; then
        mv ~/.config/kilo.bak.* ~/.config/kilo 2>/dev/null || true
      fi
      exit 1
    fi

    kilocode --version
    log_success "Kilocode CLI updated successfully"

    # 清理备份
    rm -rf ~/.config/kilo.bak.* 2>/dev/null || true
