# Kilocode CLI 插件定义
name: kilocode
version: "1.0.0"
description: Kilocode CLI - AI 编程助手命令行工具

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/kilocode/scripts/install.sh

# 环境变量配置
env:
  KILOCODE_API_KEY: optional

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/kilocode/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.config/kilo

# 健康检查
healthcheck:
  command: kilocode --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/kilocode/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/kilocode/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant