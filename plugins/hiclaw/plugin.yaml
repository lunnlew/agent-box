# HiClaw 插件定义
name: hiclaw
version: "1.6.0"
description: HiClaw - AI Agent 平台，集成 Higress 网关和 Matrix 消息平台

# 依赖要求
requires:
  - docker
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/hiclaw/scripts/install.sh

# 环境变量配置（使用官方变量名）
env:
  HICLAW_PORT_GATEWAY: export HICLAW_PORT_GATEWAY=${HICLAW_PORT_GATEWAY:-18080}
  HICLAW_PORT_CONSOLE: export HICLAW_PORT_CONSOLE=${HICLAW_PORT_CONSOLE:-18001}
  HICLAW_PORT_ELEMENT_WEB: export HICLAW_PORT_ELEMENT_WEB=${HICLAW_PORT_ELEMENT_WEB:-18088}
  HICLAW_WORKSPACE_DIR: export HICLAW_WORKSPACE_DIR=${HICLAW_WORKSPACE_DIR:-}

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/hiclaw/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/hiclaw-manager
  - ~/hiclaw-manager.env
  - /host-share

# 健康检查
healthcheck:
  command: docker ps --filter name=hiclaw-manager --filter status=running -q | grep -q .

# 服务配置
service:
  daemon: false
  auto_start: true
  command: bash ~/plugins-config/hiclaw/scripts/start.sh
  stop_command: bash ~/plugins-config/hiclaw/scripts/stop.sh
  restart_command: bash ~/plugins-config/hiclaw/scripts/restart.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/hiclaw/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/hiclaw/scripts/update.sh

# 服务端口信息（容器内端口：服务名）
ports:
  - 8080: Higress Gateway (映射到 ${HICLAW_PORT_GATEWAY:-18080})
  - 8001: Higress Console (映射到 ${HICLAW_PORT_CONSOLE:-18001})
  - 8088: Element Web (映射到 ${HICLAW_PORT_ELEMENT_WEB:-18088})

# 标签
tags:
  - ai-agent
  - higress
  - matrix
  - docker