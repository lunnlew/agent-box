# Cursor CLI 插件定义
name: cursor-cli
version: "1.0.0"
description: Cursor CLI - AI 编程助手命令行工具

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/cursor-cli/scripts/install.sh

# 环境变量配置
env:
  OPENAI_API_KEY: optional
  ANTHROPIC_API_KEY: optional

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/cursor-cli/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.cursor

# 健康检查
healthcheck:
  command: agent --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/cursor-cli/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/cursor-cli/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant