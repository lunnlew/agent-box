# Web Terminal 插件定义
name: web-terminal
version: "1.0.0"
description: Web 终端服务 - 通过浏览器访问容器终端

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/web-terminal/scripts/install.sh

# 环境变量配置
env:
  WEB_TERMINAL_PORT: export WEB_TERMINAL_PORT=${WEB_TERMINAL_PORT:-7681}
  WEB_TERMINAL_CREDENTIAL: optional
  PATH_APPEND: ~/tools/bin

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/web-terminal/scripts/post_install.sh

# 需要持久化的目录
volumes: []

# 服务配置（Web 终端服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 3
  command: bash ~/plugins-config/web-terminal/scripts/start.sh

# 健康检查
healthcheck:
  command: ttyd --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/web-terminal/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/web-terminal/scripts/update.sh

# 标签
tags:
  - web
  - terminal