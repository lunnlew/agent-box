# Docker CLI 插件定义
name: docker
version: "1.0.0"
description: Docker CLI - 容器管理工具，通过 TCP 连接操作宿主机 Docker

# 依赖要求
requires:
  - curl
  - bash

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/docker/scripts/install.sh

# 环境变量配置
env:
  DOCKER_HOST: optional
  DOCKER_VERSION: export DOCKER_VERSION=${DOCKER_VERSION:-28.0.1}

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/docker/scripts/post_install.sh

# 需要持久化的目录
volumes: []

# 健康检查
healthcheck:
  command: docker --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/docker/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/docker/scripts/update.sh

# 标签
tags:
  - cli
  - container
  - devops