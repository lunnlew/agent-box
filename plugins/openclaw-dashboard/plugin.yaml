# OpenClaw Dashboard 插件定义
# OpenClaw 官方可视化管理面板 - 纯 Web 服务，无需 GUI/ noVNC
name: openclaw-dashboard
version: "1.0.0"
description: OpenClaw Dashboard - OpenClaw AI Agent 官方可视化管理面板（纯 Web 服务）

# 依赖要求
requires:
  - nodejs >= 18
  - npm
  - git

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/openclaw-dashboard/scripts/install.sh

# 环境变量配置
env:
  DASHBOARD_PORT: export DASHBOARD_PORT=${DASHBOARD_PORT:-7000}
  WORKSPACE_DIR: export WORKSPACE_DIR=${WORKSPACE_DIR:-$HOME}
  OPENCLAW_DIR: export OPENCLAW_DIR=$HOME/.openclaw
  OPENCLAW_AGENT: export OPENCLAW_AGENT=${OPENCLAW_AGENT:-main}
  DASHBOARD_ALLOW_HTTP: export DASHBOARD_ALLOW_HTTP=true

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/openclaw-dashboard/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.openclaw
  - ~/tools/openclaw-dashboard
  - ~/logs/openclaw-dashboard.log

# 服务配置（Web 服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 5
  command: bash ~/plugins-config/openclaw-dashboard/scripts/start.sh

# 健康检查
healthcheck:
  command: curl -fsS http://localhost:${DASHBOARD_PORT:-7000} > /dev/null 2>&1

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/openclaw-dashboard/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/openclaw-dashboard/scripts/update.sh

# 标签
tags:
  - web
  - openclaw