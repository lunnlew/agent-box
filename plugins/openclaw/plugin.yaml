# OpenClaw 插件定义
name: openclaw
version: "1.0.0"
description: OpenClaw - 个人 AI 助手，支持多渠道消息平台 (WhatsApp, Telegram, Slack, Discord, Signal, iMessage 等)

# 依赖要求
requires:
  - nodejs >= 22
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/openclaw/scripts/install.sh

# 环境变量配置
env:
  OPENCLAW_PORT: export OPENCLAW_PORT=${OPENCLAW_PORT:-18789}
  OPENCLAW_GATEWAY_TOKEN: optional
  OPENCLAW_GATEWAY_BIND: export OPENCLAW_GATEWAY_BIND="lan"
  OPENCLAW_SILENT_PAIRING: export OPENCLAW_SILENT_PAIRING="true"
  PATH_APPEND: ~/tools/bin

# 需要持久化的目录
volumes:
  - ~/.openclaw

# 服务配置（Gateway 守护进程）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 5
  command: bash ~/plugins-config/openclaw/scripts/start.sh

# 健康检查
healthcheck:
  command: test -f $HOME/tools/bin/openclaw || test -f $HOME/tools/lib/node_modules/openclaw/openclaw.mjs

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/openclaw/scripts/post_install.sh

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/openclaw/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/openclaw/scripts/update.sh

# 标签
tags:
  - ai
  - messaging