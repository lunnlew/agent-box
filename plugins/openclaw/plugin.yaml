# OpenClaw 插件定义
name: openclaw
version: "1.0.0"
description: OpenClaw - 个人 AI 助手，支持多渠道消息平台 (WhatsApp, Telegram, Slack, Discord, Signal, iMessage 等)

# 依赖要求
requires:
  - nodejs >= 22
  - npm

# 安装命令
install:
  - |
    set +e

    # 获取 npm 全局安装路径
    NPM_ROOT=$(npm root -g 2>/dev/null)
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    NPM_BIN="$NPM_PREFIX/bin"
    OPENCLAW_PATH="$NPM_ROOT/openclaw"
    OPENCLAW_BIN="$NPM_BIN/openclaw"

    log_info "NPM root: $NPM_ROOT"
    log_info "NPM prefix: $NPM_PREFIX"
    log_info "NPM bin: $NPM_BIN"

    # 清理残留的临时目录（npm 安装中断会留下 .openclaw-* 目录）
    log_info "Cleaning up temp directories..."
    for tmp_dir in "$NPM_ROOT"/.openclaw-*; do
      if [ -d "$tmp_dir" ]; then
        rm -rf "$tmp_dir" 2>/dev/null || true
        log_info "  Removed temp dir: $tmp_dir"
      fi
    done

    # 卸载旧版本
    log_info "Uninstalling existing openclaw..."
    npm uninstall -g openclaw 2>/dev/null || true

    # 清理残留目录
    if [ -d "$OPENCLAW_PATH" ]; then
      rm -rf "$OPENCLAW_PATH" 2>/dev/null || true
      log_info "  Removed existing: $OPENCLAW_PATH"
    fi
    if [ -L "$OPENCLAW_BIN" ]; then
      rm -f "$OPENCLAW_BIN" 2>/dev/null || true
      log_info "  Removed symlink: $OPENCLAW_BIN"
    fi

    # 全局安装
    log_info "Installing openclaw@latest..."
    if ! npm install -g openclaw@latest; then
      log_warning "npm install failed, retrying..."
      sleep 2
      npm install -g openclaw@latest
    fi

    # 验证安装完整性
    log_info "Verifying installation..."

    # 检查 package.json 是否存在
    if [ ! -f "$OPENCLAW_PATH/package.json" ]; then
      log_error "package.json not found, installation incomplete!"
      exit 1
    fi

    # 检查主执行文件是否存在
    if [ ! -f "$OPENCLAW_PATH/openclaw.mjs" ]; then
      log_error "openclaw.mjs not found, installation incomplete!"
      exit 1
    fi

    # 检查符号链接是否存在
    if [ ! -L "$OPENCLAW_BIN" ] && [ ! -f "$OPENCLAW_BIN" ]; then
      log_warning "Binary symlink not found at $OPENCLAW_BIN"
      # 尝试备用路径
      if [ -L "$HOME/tools/bin/openclaw" ] || [ -f "$HOME/tools/bin/openclaw" ]; then
        log_info "Binary found at $HOME/tools/bin/openclaw, creating symlink..."
        mkdir -p "$(dirname "$OPENCLAW_BIN")"
        ln -sf "$HOME/tools/bin/openclaw" "$OPENCLAW_BIN" 2>/dev/null || true
      else
        log_error "Binary also not found at $HOME/tools/bin/openclaw"
        log_info "Available binaries in $HOME/tools/bin:"
        ls -la "$HOME/tools/bin/" 2>/dev/null | grep -i openclaw || echo "(none)"
        exit 1
      fi
    fi

    # 清理可能的临时目录（如果安装后还有残留）
    for tmp_dir in "$NPM_ROOT"/.openclaw-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    log_success "openclaw installed successfully"

# 环境变量配置
env:
  OPENCLAW_PORT: export OPENCLAW_PORT=${OPENCLAW_PORT:-18789}
  OPENCLAW_GATEWAY_TOKEN: optional
  OPENCLAW_GATEWAY_BIND: export OPENCLAW_GATEWAY_BIND="lan"
  OPENCLAW_SILENT_PAIRING: export OPENCLAW_SILENT_PAIRING="true"
  OPENCLAW_EXTRA_MOUNTS: export OPENCLAW_EXTRA_MOUNTS="/host-share:/host-share:rw"
  PATH_APPEND: ~/tools/bin

# 需要持久化的目录
volumes:
  - ~/.openclaw: OpenClaw 配置和数据

# 服务配置（Gateway 守护进程）
service:
  # 常驻服务，使用 Supervisor 管理
  daemon: true
  # 服务启动后自动启动
  auto_start: true
  # 服务崩溃后自动重启
  restart: true
  # 最大重启次数
  max_restarts: 5
  # 启动命令 (--force 强制清理旧进程，避免锁等待)
  command: bash -c 'openclaw gateway --port ${OPENCLAW_PORT:-18789} --bind lan'
  # ⚠️ 注意：daemon 服务使用 supervisorctl stop/start/restart
  # 不配置 stop_command 和 restart_command

# 健康检查
healthcheck:
  # 使用 test 命令检查二进制文件是否存在，避免 openclaw --version 的 Node.js 启动开销
  command: test -f $HOME/tools/bin/openclaw || test -f $HOME/tools/lib/node_modules/openclaw/openclaw.mjs

# 安装后配置
post_install:
  - |
    set +e
    mkdir -p ~/.openclaw/devices
    rm -rf ~/.openclaw/extensions/lossless-claw 2>/dev/null || true
    if command -v openclaw &> /dev/null; then
      openclaw plugins install @martian-engineering/lossless-claw || true
    fi
    echo ""
    echo "============================================"
    echo "  OpenClaw 安装完成!"
    echo "============================================"
    echo ""
    echo "快速开始:"
    echo "  1. 设置 Token: export OPENCLAW_GATEWAY_TOKEN=your-token"
    echo "  2. 运行向导配置：openclaw onboard"
    echo "  3. 启动 Gateway: openclaw gateway --port ${OPENCLAW_PORT:-18789}"
    echo "  4. 访问 Dashboard: http://localhost:${OPENCLAW_PORT:-18789}"
    echo ""
    echo "或直接运行：openclaw dashboard --no-open"
    echo "============================================"
    echo ""

# 卸载命令
uninstall:
  - |
    set +e

    log_info "Uninstalling OpenClaw..."

    # 停止 Gateway
    openclaw gateway stop 2>/dev/null || true

    # npm 卸载
    npm uninstall -g openclaw 2>/dev/null || true

    rm -rf ~/supervisor/openclaw.conf 2>/dev/null || true
    rm -rf ~/supervisor/openclaw.sh 2>/dev/null || true

    # 清理安装目录
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    OPENCLAW_PATH="$NPM_ROOT/openclaw"
    OPENCLAW_BIN="$NPM_PREFIX/bin/openclaw"

    [ -d "$OPENCLAW_PATH" ] && rm -rf "$OPENCLAW_PATH" 2>/dev/null || true
    [ -L "$OPENCLAW_BIN" ] && rm -f "$OPENCLAW_BIN" 2>/dev/null || true

    # ⚠️ 保留用户配置和数据（devices、配置等）
    # 如需完全清理，手动执行：rm -rf ~/.openclaw
    log_info "User data preserved in ~/.openclaw"

    log_success "OpenClaw uninstalled"

# 更新命令
update:
  - |
    set +e

    NPM_ROOT=$(npm root -g 2>/dev/null)
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    OPENCLAW_PATH="$NPM_ROOT/openclaw"

    log_info "Updating OpenClaw..."

    # 更新
    npm update -g openclaw@latest || {
      log_warning "Update failed, reinstalling..."
      npm install -g openclaw@latest
    }

    # 验证
    if [ ! -f "$OPENCLAW_PATH/package.json" ]; then
      log_error "Update verification failed"
      exit 1
    fi

    openclaw --version
    log_success "OpenClaw updated successfully"
