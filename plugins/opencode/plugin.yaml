# OpenCode AI 插件定义
name: opencode
version: "1.0.0"
description: OpenCode AI - 开源 AI 编程助手

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/opencode/scripts/install.sh

# 环境变量配置
env:
  OPENAI_API_KEY: optional
  ANTHROPIC_API_KEY: optional

# 安装后提示 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/opencode/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.opencode

# 健康检查
healthcheck:
  command: opencode --version

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/opencode/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/opencode/scripts/update.sh

# 标签
tags:
  - cli
  - ai
  - coding-assistant