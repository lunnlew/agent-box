# OpenCode 插件定义
name: opencode
version: "1.0.0"
description: OpenCode AI - 开源AI编程助手

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令
install:
  - |
    # 先尝试正常卸载
    npm uninstall -g opencode-ai 2>/dev/null || true
    # 清理可能残留的目录（处理 ENOTEMPTY 错误）
    OPENCODE_PATH=$(npm root -g 2>/dev/null)/opencode-ai
    if [ -d "$OPENCODE_PATH" ]; then
      rm -rf "$OPENCODE_PATH" 2>/dev/null || true
    fi
    # 全局安装
    npm install -g opencode-ai

# 环境变量配置
env:
  OPENAI_API_KEY: optional
  ANTHROPIC_API_KEY: optional

# 需要持久化的目录
volumes:
  - ~/.opencode: OpenCode配置和缓存

# 健康检查
healthcheck:
  command: opencode --version

# 卸载命令
uninstall:
  - npm uninstall -g opencode-ai

# 更新命令
update:
  - npm update -g opencode-ai