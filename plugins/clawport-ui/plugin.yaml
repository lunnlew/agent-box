# ClawPort UI 插件定义
# ClawPort - OpenClaw AI Agent 可视化管理中心（Org Map、Chat、Kanban、Cron 监控等）
name: clawport-ui
version: "1.0.0"
description: ClawPort UI - OpenClaw AI Agent 可视化管理中心，提供组织架构图、Agent 聊天、看板、Cron 监控等功能

# 依赖要求
requires:
  - nodejs >= 22
  - npm

# 安装命令 - 使用外部脚本文件
install:
  - bash ~/plugins-config/clawport-ui/scripts/install.sh

# 环境变量配置
env:
  CLAWPORT_PORT: export CLAWPORT_PORT=${CLAWPORT_PORT:-3000}
  WORKSPACE_PATH: export WORKSPACE_PATH=${WORKSPACE_PATH:-$HOME/.openclaw/workspace}
  OPENCLAW_BIN: export OPENCLAW_BIN=$HOME/tools/bin/openclaw
  OPENCLAW_GATEWAY_TOKEN: optional
  OPENCLAW_GATEWAY_PORT: export OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
  NEXT_PUBLIC_CLAWPORT_PORT: export NEXT_PUBLIC_CLAWPORT_PORT=${CLAWPORT_PORT:-3000}
  PATH_APPEND: ~/tools/bin

# 安装后配置 - 使用外部脚本文件
post_install:
  - bash ~/plugins-config/clawport-ui/scripts/post_install.sh

# 需要持久化的目录
volumes:
  - ~/.openclaw
  - ~/.config/clawport-ui

# 服务配置（Web 服务）
service:
  daemon: true
  auto_start: true
  restart: true
  max_restarts: 5
  command: bash ~/plugins-config/clawport-ui/scripts/start.sh

# 健康检查
healthcheck:
  command: curl -fsS http://localhost:${CLAWPORT_PORT:-3000} > /dev/null 2>&1 || command -v clawport &>/dev/null

# 卸载命令 - 使用外部脚本文件
uninstall:
  - bash ~/plugins-config/clawport-ui/scripts/uninstall.sh

# 更新命令 - 使用外部脚本文件
update:
  - bash ~/plugins-config/clawport-ui/scripts/update.sh

# 标签
tags:
  - web
  - openclaw