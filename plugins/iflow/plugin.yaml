# iFlow AI 插件定义
name: iflow
version: "1.0.0"
description: iFlow AI CLI - AI 编程助手

# 依赖要求
requires:
  - nodejs >= 18
  - npm

# 安装命令
install:
  - |
    set +e

    PKG_NAME="@iflow-ai/iflow-cli"
    NPM_ROOT=$(npm root -g 2>/dev/null)
    PKG_PATH="$NPM_ROOT/@iflow-ai/iflow-cli"
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    PKG_BIN="$NPM_PREFIX/bin/iflow"

    log_info "NPM root: $NPM_ROOT"
    log_info "NPM prefix: $NPM_PREFIX"
    log_info "Installing iFlow AI..."

    # 清理旧版本
    log_info "Cleaning up existing installation..."
    npm uninstall -g "$PKG_NAME" 2>/dev/null || true
    [ -d "$PKG_PATH" ] && rm -rf "$PKG_PATH" 2>/dev/null || true
    [ -L "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true
    [ -f "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true

    # 清理临时目录
    for tmp_dir in "$NPM_ROOT"/.iflow-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    # 创建全局配置目录
    mkdir -p /etc/iflow-cli 2>/dev/null || true

    # 安装
    log_info "Installing package..."
    if ! npm install -g "$PKG_NAME"@latest; then
      log_warning "First attempt failed, retrying..."
      sleep 2
      npm install -g "$PKG_NAME"@latest
    fi

    # 验证安装
    log_info "Verifying installation..."
    if [ ! -f "$PKG_PATH/package.json" ]; then
      log_error "Installation incomplete: package.json missing"
      exit 1
    fi

    # 检查二进制文件或符号链接是否存在
    if [ ! -L "$PKG_BIN" ] && [ ! -f "$PKG_BIN" ]; then
      log_error "Installation incomplete: binary not found at $PKG_BIN"
      # 尝试备用路径
      if [ -L "$HOME/tools/bin/iflow" ] || [ -f "$HOME/tools/bin/iflow" ]; then
        log_info "Binary found at $HOME/tools/bin/iflow, creating symlink..."
        mkdir -p "$(dirname "$PKG_BIN")"
        ln -sf "$HOME/tools/bin/iflow" "$PKG_BIN" 2>/dev/null || true
      else
        log_error "Binary also not found at $HOME/tools/bin/iflow"
        log_info "Available binaries in $HOME/tools/bin:"
        ls -la "$HOME/tools/bin/" 2>/dev/null | grep -i iflow || echo "(none)"
        exit 1
      fi
    fi

    # 最终清理
    for tmp_dir in "$NPM_ROOT"/.iflow-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    iflow --version
    log_success "iFlow AI installed successfully"

# 环境变量配置
env:
  IFLOW_API_KEY: optional
  IFLOW_BASE_URL: optional
  IFLOW_MODEL_NAME: optional
  IFLOW_CLI_SYSTEM_SETTINGS_PATH: export IFLOW_CLI_SYSTEM_SETTINGS_PATH="$HOME/tools/iflow-cli/settings.json"

# 需要持久化的目录
volumes:
  - ~/.iflow: iFlow 用户配置
  - /etc/iflow-cli/settings.json: iFlow 全局配置

# 健康检查
healthcheck:
  command: iflow --version

# 卸载命令
uninstall:
  - |
    set +e

    PKG_NAME="@iflow-ai/iflow-cli"
    PKG_PATH="$(npm root -g 2>/dev/null)/@iflow-ai/iflow-cli"
    # npm 10.x 不支持 bin -g，使用 prefix + /bin 替代
    NPM_PREFIX=$(npm prefix -g 2>/dev/null)
    PKG_BIN="$NPM_PREFIX/bin/iflow"

    log_info "Uninstalling iFlow AI..."

    # npm 卸载
    npm uninstall -g "$PKG_NAME" 2>/dev/null || true

    # 清理残留目录
    [ -d "$PKG_PATH" ] && rm -rf "$PKG_PATH" 2>/dev/null || true
    [ -L "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true
    [ -f "$PKG_BIN" ] && rm -f "$PKG_BIN" 2>/dev/null || true

    # 清理临时目录
    for tmp_dir in "$(npm root -g 2>/dev/null)"/.iflow-*; do
      [ -d "$tmp_dir" ] && rm -rf "$tmp_dir" 2>/dev/null || true
    done

    # 清理全局配置
    rm -f /etc/iflow-cli/settings.json 2>/dev/null || true
    rmdir /etc/iflow-cli 2>/dev/null || true

    # 可选：保留用户配置
    # rm -rf ~/.iflow 2>/dev/null || true

    log_success "iFlow AI uninstalled"

# 更新命令
update:
  - |
    set +e

    PKG_NAME="@iflow-ai/iflow-cli"
    PKG_PATH="$(npm root -g 2>/dev/null)/@iflow-ai/iflow-cli"

    log_info "Updating iFlow AI..."

    # 备份用户配置
    if [ -d ~/.iflow ]; then
      cp -r ~/.iflow ~/.iflow.bak.$(date +%Y%m%d%H%M%S) 2>/dev/null || true
    fi

    # 更新
    npm update -g "$PKG_NAME" || {
      log_warning "Update failed, reinstalling..."
      npm install -g "$PKG_NAME"@latest
    }

    # 验证
    if [ ! -f "$PKG_PATH/package.json" ]; then
      log_error "Update verification failed"
      # 恢复备份
      if [ -d ~/.iflow.bak.* ]; then
        mv ~/.iflow.bak.* ~/.iflow 2>/dev/null || true
      fi
      exit 1
    fi

    iflow --version
    log_success "iFlow AI updated successfully"

    # 清理备份
    rm -rf ~/.iflow.bak.* 2>/dev/null || true
