version: '3.8'

# ============================================================
# 数据管理策略
# ============================================================
# 所有数据通过 ./data 目录挂载到容器内 ~/ (即 /home/agent)
#
# volumes 格式：
#   - ~/path              # 直接创建目录
#   - ~/path: /data/xxx   # 创建符号链接 ~/path → /data/xxx
#
# 示例：
#   volumes:
#     - ~/.claude                    # 直接使用
#     - ~/workspace: /shared/work    # 符号链接到共享位置
#
# 映射缓存：~/.volume-map（记录卷声明关系）
# ============================================================

services:
  agentbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_TRUSTED_HOST: mirrors.aliyun.com
        UBUNTU_MIRROR: aliyun
        GOPROXY: https://goproxy.cn,direct
    container_name: agentbox
    hostname: agentbox
    env_file:
      - .env
    volumes:
      # 主数据目录（所有插件数据）
      - ./data:/home/agent:rw
      # 插件配置文件（只读）
      - ./config/plugins.yaml:/home/agent/config/plugins.yaml:ro
      # 插件定义目录（可读写，容器内添加执行权限）
      - ./plugins:/home/agent/plugins-config:rw
      # Docker socket（容器内可直接使用 Docker，支持 DinD 插件）
      - /var/run/docker.sock:/var/run/docker.sock
      # 共享目录（主机-容器文件交换）
      - ./host-share:/host-share

      - E:/npm-cache:/home/agent/.npm:rw
      - E:/pip:/home/agent/.pip:rw

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # AgentBox Dashboard
      - "${BOARD_PORT:-8888}:8888"
      # VS Code Server (容器内 8080)
      - "${VSCODE_PORT:-8080}:8080"
      # Web Terminal (容器内 7681)
      - "${WEB_TERMINAL_PORT:-7681}:7681"
      # OpenClaw Gateway (容器内 18789)
      - "${OPENCLAW_PORT:-18789}:18789"
      # OpenClaw Dashboard (容器内 7000)
      - "${DASHBOARD_PORT:-7000}:7000"
      # ClawPort UI (容器内 3000)
      - "${CLAWPORT_PORT:-3000}:3000"
      # ClawPanel (容器内 1420)
      - "${CLAWPANEL_PORT:-1420}:1420"
      # Skills Manager (容器内 6080)
      - "${SKILLS_MANAGER_NOVNC_PORT:-6080}:6080"
      # OpenClaw Manager (容器内 6081)
      - "${OPENCLAW_MANAGER_NOVNC_PORT:-6081}:6081"
      # OpenSpace Dashboard Backend (容器内 7788)
      - "${OPENSPACE_PORT:-7788}:7788"
      # OpenSpace Dashboard Frontend (容器内 5174)
      - "${OPENSPACE_FRONTEND_PORT:-5174}:5174"

    # Docker socket 权限
    group_add:
      - "999"
    # 保持容器持续运行
    tty: true
    stdin_open: true
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
