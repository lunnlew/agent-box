version: '3.8'

services:
  agentbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_TRUSTED_HOST: mirrors.aliyun.com
        UBUNTU_MIRROR: aliyun
        GOPROXY: https://goproxy.cn,direct
    container_name: agentbox
    hostname: agentbox
    env_file:
      - .env
    volumes:
      # 主数据目录
      - ./data:/home/agent
      # 插件配置文件
      - ./config/plugins.yaml:/home/agent/config/plugins.yaml:ro
      # 插件定义目录
      - ./plugins:/home/agent/plugins-config:ro
      # Docker socket (容器内可直接使用 Docker)
      - /var/run/docker.sock:/var/run/docker.sock
      # 工作目录（持久化用户数据和日志）
      - ./data:/home/agent/workspace/agent-box/data
      # 共享目录
      - ./host-share:/host-share
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # AgentBox Dashboard
      - "${BOARD_PORT:-8888}:8888"
      # VS Code Server (容器内 8080)
      - "${VSCODE_PORT:-8080}:8080"
      # Web Terminal (容器内 7681)
      - "${WEB_TERMINAL_PORT:-7681}:7681"
      # OpenClaw Gateway (容器内 18789)
      - "${OPENCLAW_PORT:-18789}:18789"
      # OpenClaw Dashboard (容器内 7000)
      - "${DASHBOARD_PORT:-7000}:7000"
      # ClawPort UI (容器内 3000)
      - "${CLAWPORT_PORT:-3000}:3000"
      # CoPaw Gateway (容器内 8088)
      - "${COPAW_PORT:-8088}:8088"
      # ClawPanel (容器内 1420)
      - "${CLAWPANEL_PORT:-1420}:1420"
      # Skills Manager (容器内 6080)
      - "${SKILLS_MANAGER_NOVNC_PORT:-6080}:6080"
      # OpenClaw Manager (容器内 6081)
      - "${OPENCLAW_MANAGER_NOVNC_PORT:-6081}:6081"

    # Docker socket 权限
    group_add:
      - "999"
    # 保持容器持续运行
    tty: true
    stdin_open: true
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
